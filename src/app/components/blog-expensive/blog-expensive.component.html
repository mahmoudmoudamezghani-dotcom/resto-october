  <section class="exclusive_item_part blog_item_section">
        <div class="container">
            <div class="row">
                <div class="col-xl-5">
                    <div class="section_tittle">
                        <p>Popular Dishes</p>
                        <h2>Our Exclusive Items</h2>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-6 col-lg-4" *ngFor="let elt of items">
                    <div class="single_blog_item">
                        <div class="single_blog_img">
                            <img src="img/food_item/food_item_1.png" alt="">
                        </div>
                        <div class="single_blog_text">
                            <h3>{{elt.id}}</h3>
                            <p>{{elt.def}} </p>
                            <a href="#" class="btn_3">Read More <img src={{elt.img}} alt=""></a>
                        </div>
                    </div>
                </div>
              
            </div>
        </div>
    </section>
